name: Publish to pub.dev

# ──────────────────────────────────────────────
#  Setup Required — do once before first release
# ──────────────────────────────────────────────
#  1. Run locally:  dart pub publish
#  2. After success, copy the file:
#       ~/.config/dart/pub-credentials.json
#  3. Add its content as a GitHub secret named:
#       PUB_DEV_CREDENTIALS
#     (Settings → Secrets and variables → Actions)
# ──────────────────────────────────────────────

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify pubspec version matches release tag
        run: |
          PUBSPEC_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pubspec: $PUBSPEC_VERSION"
          echo "tag:     $TAG_VERSION"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch — pubspec.yaml says $PUBSPEC_VERSION but tag is $TAG_VERSION"
            exit 1
          fi
          echo "✅ Version match"

      - name: Analyze
        run: flutter analyze

      - name: Validate package
        run: flutter pub publish --dry-run

      - name: Restore pub.dev credentials
        run: |
          mkdir -p "$HOME/.config/dart"
          echo "$PUB_DEV_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
        env:
          PUB_DEV_CREDENTIALS: ${{ secrets.PUB_DEV_CREDENTIALS }}

      - name: Publish to pub.dev
        run: flutter pub publish --force
