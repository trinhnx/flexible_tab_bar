name: flexible_tab_bar
description: A beautifully animated, flex-based tab bar for Flutter. Active tabs expand, inactive tabs compact — with icons, labels, optional count badges, and smooth transitions.
version: 0.2.0
repository: https://github.com/trinhnx/flexible_tab_bar
homepage: https://trinhnx.dev
issue_tracker: https://github.com/trinhnx/flexible_tab_bar/issues

environment:
  sdk: ^3.0.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
